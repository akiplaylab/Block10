name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Request Pages preview]
    types: [completed]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'pull_request_target' &&
         github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      previews: ${{ steps.previews.outputs.previews }}
    steps:
      - id: previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previews=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" |
            jq -ce --arg repo "$GITHUB_REPOSITORY" '
              add | map(select(.head.repo.full_name == $repo)
                | {number, title, sha: .head.sha}) | sort_by(.number)
            ')
          printf 'previews=%s\n' "$previews" >> "$GITHUB_OUTPUT"

  preview:
    needs: select
    if: needs.select.outputs.previews != '[]'
    strategy:
      fail-fast: false
      matrix:
        preview: ${{ fromJSON(needs.select.outputs.previews) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.preview.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run test --if-present
      - env:
          VITE_TEST_PR: ${{ matrix.preview.number }}
          VITE_TEST_SHA: ${{ matrix.preview.sha }}
        run: |
          if [[ -f src/storage.ts ]]; then
            sed -i "s/? 'block10\.test' : 'block10';/? 'block10.test.pr-$VITE_TEST_PR' : 'block10';/" src/storage.ts
          fi
          repository="${GITHUB_REPOSITORY#*/}"
          npm run build:test -- --base "/${repository,,}/test/pr-$VITE_TEST_PR/"
          grep -Fq 'name="robots" content="noindex"' dist/index.html
          grep -Fq "TEST · PR #$VITE_TEST_PR · ${VITE_TEST_SHA:0:7}" dist/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-${{ matrix.preview.number }}
          path: dist
          if-no-files-found: error
          overwrite: true

  package:
    needs: [select, preview]
    if: ${{ !cancelled() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run build
      - if: needs.preview.result != 'skipped'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pr-*
          path: dist/test
      - env:
          PREVIEWS: ${{ needs.select.outputs.previews }}
        run: node build/pages-preview-index.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
