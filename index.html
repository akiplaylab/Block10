<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#83d7ff">
    <meta name="apple-mobile-web-app-title" content="ブロック 10">
    <meta name="description" content="ブロックをあわせて、にじいろの10をつくろう。小学1年生向けの、やさしい足し算ゲーム。">
    <meta property="og:title" content="ブロック 10">
    <meta property="og:description" content="ブロックをあわせて、にじいろの10をつくろう。小学1年生向けの、やさしい足し算ゲーム。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://akiplaylab.github.io/Block10/">
    <meta property="og:image" content="https://akiplaylab.github.io/Block10/ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="青空と虹を背景に、青とオレンジのブロックと虹色の10が並ぶブロック 10のイラスト">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ブロック 10">
    <meta name="twitter:description" content="ブロックをあわせて、にじいろの10をつくろう。小学1年生向けの、やさしい足し算ゲーム。">
    <meta name="twitter:image" content="https://akiplaylab.github.io/Block10/ogp.png">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>ブロック 10</title>
  </head>
  <body>
    <div class="scenery" aria-hidden="true">
      <div class="sky-rainbow"></div>
      <div class="cloud cloud-left"></div><div class="cloud cloud-right"></div>
      <div class="cloud cloud-bottom-left"></div><div class="cloud cloud-bottom-right"></div>
      <span class="sky-star star-one">✦</span><span class="sky-star star-two">✦</span>
      <span class="sky-star star-three">✦</span><span class="sky-star star-four">✦</span>
    </div>
    <header>
      <button id="home" class="utility" type="button" hidden><span aria-hidden="true">⌂</span> ホーム</button>
      <div id="score" class="score" aria-live="polite" hidden></div>
      <button id="sound" class="utility sound" type="button" aria-label="おと" aria-pressed="true">
        <span class="speaker" aria-hidden="true"></span><span id="sound-state" aria-hidden="true">ON</span>
      </button>
    </header>
    <main>
      <section id="title" class="title-screen">
        <h1 class="logo" aria-label="ブロック 10">
          <span aria-hidden="true">ブ</span><span aria-hidden="true">ロ</span><span aria-hidden="true">ッ</span><span aria-hidden="true">ク</span><strong aria-hidden="true">10</strong>
        </h1>
        <div class="block-pile" aria-hidden="true">
          <i class="block blue"></i><i class="block orange"></i><i class="block pink"></i>
        </div>
        <button id="play" class="primary" type="button"><span class="play-icon" aria-hidden="true"></span>あそぶ</button>
        <p id="offline-ready" class="offline-ready" role="status" hidden>オフラインであそべます</p>
      </section>
      <section id="game" class="game-screen" aria-label="ブロック 10" hidden>
        <div class="equation" aria-live="polite" aria-atomic="true">
          <span id="first"></span><span>+</span><span id="second"></span><span>=</span><span id="answer">?</span>
        </div>
        <div class="board" role="img" aria-label="ブロックの盤面">
          <div id="top-row" class="row" aria-hidden="true"></div>
          <div id="bottom-row" class="row reserved" aria-hidden="true"></div>
        </div>
        <div class="feedback">
          <p id="feedback" role="status"></p>
          <div id="overflow" class="overflow" aria-hidden="true"></div>
        </div>
        <div class="turn">
          <div id="supply" class="supply" aria-label="おくブロック"></div>
          <div id="result" class="result" hidden><span aria-hidden="true">✦</span> できた！ <span aria-hidden="true">✦</span></div>
        </div>
        <div class="actions">
          <button id="hint" class="utility" type="button"><span aria-hidden="true">✦</span> ヒント</button>
          <button id="next" class="primary" type="button" hidden>つぎへ</button>
        </div>
      </section>
    </main>
    <div id="effects" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
